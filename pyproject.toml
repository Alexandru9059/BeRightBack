[build-system]
requires=["setuptools>=69", "wheel"]
build-backend="setuptools.build_meta"

[project]
name="brb"
version="0.1.0"
requires-python=">=3.12"
dependencies=[
    "typer>=0.12.0",
    "google-genai>=2.7.0",
    "python-dotenv>=1.2.2"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.5.0",
    "mypy>=1.10.0"
]

[project.scripts]
brb="brb.cli:app"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
pythonpath = ["src"]
addopts = "-q"

[tool.mypy]
python_version = "3.12"
packages = ["brb"]
strict = true